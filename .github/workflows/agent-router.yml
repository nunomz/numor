name: agent-router

# Turns the repository owner's activity into agent runs:
#   label "agent" on an issue           -> Claude implements it
#   comment on an agent:needs-info issue -> Claude resumes with the answer
#   "@claude ..." on an agent PR         -> Claude addresses the comment
#   "/review" on an agent PR             -> Codex reviews again
#   "request changes" review on agent PR -> Claude addresses the review
# Only the owner can trigger anything. The job-level `if` keeps every other
# event from starting a runner at all.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  route:
    if: >-
      github.event.sender.login == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'agent') ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
          contains(github.event.issue.labels.*.name, 'agent:needs-info')) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          (contains(github.event.comment.body, '@claude') || startsWith(github.event.comment.body, '/review'))) ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' &&
          startsWith(github.event.pull_request.head.ref, 'agent/'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-router-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/agent
          persist-credentials: false
      - name: Route
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash .github/agent/route.sh
