name: agent-gate

# Runs whenever CI finishes on an agent branch (agent-review starts it directly
# after publishing its verdict) and decides:
# merge, start a Claude fix round, or hand the PR to the owner. See
# .github/agent/gate.sh. The workflow list below must name every CI workflow
# that runs on pull requests.

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string

permissions:
  contents: read
  actions: write
  checks: read
  statuses: read
  issues: read
  pull-requests: read

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-gate-${{ inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/agent
          persist-credentials: false

      - name: Mint agent app token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Decide
        env:
          PR: ${{ inputs.pr }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash .github/agent/gate.sh
